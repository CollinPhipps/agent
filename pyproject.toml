[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Collin Phipps", email = "phippscollin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "arxiv>=4.0.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "vdb",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
vdb = { path = "/home/phipp/vdb", editable = true }
